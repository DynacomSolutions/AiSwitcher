name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch the push-event base commit (dangles after a force-push/rollback)
        if: github.event_name == 'push'
        env:
          PRIVACY_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PRIVACY_BASE_SHA" ] && ! git cat-file -e "${PRIVACY_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$PRIVACY_BASE_SHA" \
              || echo "::warning::privacy base $PRIVACY_BASE_SHA unfetchable; privacy-check falls back to scanning the head commit"
          fi

      - name: Check privacy of incoming commits
        env:
          PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run privacy:check --ci

      # Belt-and-braces: hostnames/domains/emails/IPs/home paths outside the
      # reviewed allowlist are blocked whether they arrive via an incoming
      # commit or were already sitting in the tree.
      - name: Check identifiers of incoming commits
        env:
          IDENTIFIER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IDENTIFIER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run scripts/identifier-scan.ts --ci

      - name: Check identifiers across the tracked tree
        run: bun run scripts/identifier-scan.ts --tree

      # Installed if present on the runner image, else scripts/secret-scan.ts
      # falls back to its own built-in token-shape scanner automatically.
      - name: Check secrets of incoming commits
        env:
          IDENTIFIER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IDENTIFIER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run scripts/secret-scan.ts --ci

      - name: Check secrets across the tracked tree
        run: bun run scripts/secret-scan.ts --tree

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Claude Code refuses to load a mod that fails this check (e.g. #184), and
      # the unit tests import the module directly so they never notice.
      - name: Validate Claude Code mods
        run: |
          for m in mods/*/; do
            npx -y @anthropic-ai/claude-code@2.1.301 plugin validate "$m"
          done

      # Catches, among other things, a new toolName joining the union without
      # the exhaustive cases that used to crash `ais usage` at runtime (see
      # providerForTool and the noImplicitReturns compiler option).
      - name: Typecheck
        run: bun run typecheck

      # The live-image script tests drive expect and node.
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect nodejs

      - name: Test
        env:
          AIS_REQUIRE_LIVE_TEST_TOOLS: "1"
        run: bun test

  # Decides whether the macOS and host app jobs are needed. Pushes to main always run them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      host: ${{ steps.filter.outputs.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths that can affect execve on macOS or the host app
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fails open: any doubt about the diff runs both jobs.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "host=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "host=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(src/|test/|\.github/workflows/ci\.yml$|package\.json$|bun\.lock$|tsconfig\.json$)'; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi
          # The host crates also build from image/release-key.pub and src/live/path-classes.json.
          if printf '%s\n' "$changed" | grep -Eq '^(apps/host/|image/release-key\.pub$|src/live/path-classes\.json$|\.github/workflows/ci\.yml$)'; then
            echo "host=true" >> "$GITHUB_OUTPUT"
          else
            echo "host=false" >> "$GITHUB_OUTPUT"
          fi

  # GitHub-hosted runner only: this repository is public, never self-hosted.
  test-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The shim replaces itself with the real tool via posix_spawn(SETEXEC).
      - name: Test execve, session sidecar and shim end to end
        run: bun test test/shim-execve.test.ts test/shared/execve.test.ts test/shared/session-sidecar.test.ts

  # GitHub-hosted runner only: this repository is public, never self-hosted.
  test-host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: apps/host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The Tauri crate embeds the built frontend (../dist), which is not tracked.
      - name: Build the frontend
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      # exfatprogs provides mkfs.exfat and fsck.exfat for the file_create tests.
      - name: Install Tauri Linux build dependencies and exfatprogs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            exfatprogs libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libssl-dev libdbus-1-dev pkg-config
          # The package installs into an sbin directory the test process may not have on PATH.
          mkfs=$(dpkg -L exfatprogs | grep -m1 '/mkfs\.exfat$')
          echo "AIS_HOST_TEST_EXFAT_TOOLS=$(dirname "$mkfs")" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the toolchain and its components; rustup installs them on first use.
      - name: Clippy
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          set -euo pipefail
          cargo test --workspace --all-features
