name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Gateway store tests (test/gateway/pg-store.test.ts), on a pinned
    # TimescaleDB image so the hypertable path is exercised.
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Fetch the push-event base commit (dangles after a force-push/rollback)
        if: github.event_name == 'push'
        env:
          PRIVACY_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PRIVACY_BASE_SHA" ] && ! git cat-file -e "${PRIVACY_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$PRIVACY_BASE_SHA" \
              || echo "::warning::privacy base $PRIVACY_BASE_SHA unfetchable; privacy-check falls back to scanning the head commit"
          fi

      - name: Check privacy of incoming commits
        env:
          PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run privacy:check --ci

      # Belt-and-braces: hostnames/domains/emails/IPs/home paths outside the
      # reviewed allowlist are blocked whether they arrive via an incoming
      # commit or were already sitting in the tree.
      - name: Check identifiers of incoming commits
        env:
          IDENTIFIER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IDENTIFIER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run scripts/identifier-scan.ts --ci

      - name: Check identifiers across the tracked tree
        run: bun run scripts/identifier-scan.ts --tree

      # Installed if present on the runner image, else scripts/secret-scan.ts
      # falls back to its own built-in token-shape scanner automatically.
      - name: Check secrets of incoming commits
        env:
          IDENTIFIER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IDENTIFIER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run scripts/secret-scan.ts --ci

      - name: Check secrets across the tracked tree
        run: bun run scripts/secret-scan.ts --tree

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Claude Code refuses to load a mod that fails this check (e.g. #184), and
      # the unit tests import the module directly so they never notice.
      - name: Validate Claude Code mods
        run: |
          for m in mods/*/; do
            npx -y @anthropic-ai/claude-code@2.1.301 plugin validate "$m"
          done

      # Catches, among other things, a new toolName joining the union without
      # the exhaustive cases that used to crash `ais usage` at runtime (see
      # providerForTool and the noImplicitReturns compiler option).
      - name: Typecheck
        run: bun run typecheck

      # The live-image script tests drive expect and node.
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect nodejs

      - name: Test
        env:
          AIS_REQUIRE_LIVE_TEST_TOOLS: "1"
          AIS_GATEWAY_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/gateway_test
        run: bun test

  # Decides whether the macOS job is needed. Pushes to main always run it.
  # The host app is built and tested by host-app.yml.
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths that can affect execve on macOS
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fails open: any doubt about the diff runs the job.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "extension=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "extension=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The extension imports protocol types from src/browser; shared inputs run everything.
          if printf '%s\n' "$changed" | grep -Eq '^(apps/chrome-extension/|src/browser/|\.github/workflows/ci\.yml$|package\.json$|bun\.lock$|\.bun-version$)'; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
          else
            echo "extension=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(src/|test/|\.github/workflows/ci\.yml$|package\.json$|bun\.lock$|tsconfig\.json$)'; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  # GitHub-hosted runner only: this repository is public, never self-hosted.
  test-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The shim replaces itself with the real tool via posix_spawn(SETEXEC).
      - name: Test execve, session sidecar and shim end to end
        run: bun test test/shim-execve.test.ts test/shared/execve.test.ts test/shared/session-sidecar.test.ts

  # GitHub-hosted runner only. Unit tests run in the root `bun test` (test job), so this job only builds.
  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/chrome-extension
        run: bun run build

      - name: Check the build output
        run: test -f apps/chrome-extension/dist/manifest.json

  # Always runs, so a required check keeps reporting when path-gated jobs are skipped.
  ci-gate:
    if: always()
    needs: [test, changes, test-macos, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
