name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Catches, among other things, a new toolName joining the union without
      # the exhaustive cases that used to crash `ais usage` at runtime (see
      # providerForTool and the noImplicitReturns compiler option).
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
