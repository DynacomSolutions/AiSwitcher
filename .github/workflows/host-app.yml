name: Host app

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      production:
        type: boolean
        default: false
      ref:
        type: string
        required: true

permissions:
  contents: read

# Supersede stale pull-request runs only; pushes and release calls always finish.
concurrency:
  group: host-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.paths.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HOST_PRODUCTION: ${{ inputs.production }}
        run: bun run scripts/host/affected.ts --github

  checks:
    needs: changes
    if: needs.changes.outputs.selection != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Check privacy across incoming commits
        run: |
          if [ -z "$PRIVACY_BASE_SHA" ]; then
            PRIVACY_BASE_SHA="$(git rev-parse "$PRIVACY_HEAD_SHA^")"
            export PRIVACY_BASE_SHA
          fi
          bun run privacy:check --ci
        env:
          PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bun run scripts/host/check-workflows.ts
      - name: Prepare exchange-driver regression
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
          echo "HOST_TEST_SCRATCH=$RUNNER_TEMP/host-exchange" >> "$GITHUB_ENV"
      - name: Tests selected by dependencies
        # The full suite already runs in CI; this job covers the host tests only.
        run: bun test test/host

  native:
    needs: changes
    if: needs.changes.outputs.selection != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      HOST_PRODUCTION: ${{ inputs.production }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set isolated build directories
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/host-cargo" >> "$GITHUB_ENV"
          echo "HOST_BUILD_DIR=$RUNNER_TEMP/host-build" >> "$GITHUB_ENV"
      - name: Install Linux native build and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2t64 xvfb exfatprogs
          # The package installs into an sbin directory the test process may not have on PATH.
          mkfs=$(dpkg -L exfatprogs | grep -m1 '/mkfs\.exfat$')
          echo "AIS_HOST_TEST_EXFAT_TOOLS=$(dirname "$mkfs")" >> "$GITHUB_ENV"
      # Skipped for production builds: release artefacts never reuse cached binaries.
      - name: Cache Cargo registry, tauri-cli and build output
        if: inputs.production != true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/host
          key: ${{ matrix.target }}
      - name: Install locked dependencies and native toolchain
        run: |
          bun install --frozen-lockfile
          bun install --cwd apps/host --frozen-lockfile
          cd apps/host
          rustup show
          cargo install tauri-cli --version 2.12.3 --locked
      # generate_context! needs the built frontend before any cargo step.
      - name: Frontend typecheck and build
        working-directory: apps/host
        run: |
          bun run typecheck
          bun run build
      - name: Rust format, tests and lint
        working-directory: apps/host
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      # Moved from ci.yml test-host: lints the file-test code the default clippy run skips.
      - name: Clippy with all features
        if: runner.os == 'Linux'
        working-directory: apps/host
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: File-backed integration tests
        if: runner.os == 'Linux'
        working-directory: apps/host
        run: cargo test --locked --workspace --features file-test
      - name: Browser smoke
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/host-playwright" --no-audit --no-fund @playwright/test@1.58.2
          node "$RUNNER_TEMP/host-playwright/node_modules/playwright/cli.js" install --with-deps chromium
          export HOST_PLAYWRIGHT_MODULE="$RUNNER_TEMP/host-playwright/node_modules/@playwright/test"
          bun run --cwd apps/host test:smoke
      - name: Package and smoke the native app
        run: |
          args=()
          if [ "$HOST_PRODUCTION" = true ]; then args+=(--production); fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bun run scripts/host/build-release.ts "${args[@]}"
          else
            bun run scripts/host/build-release.ts "${args[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: host-unsigned-${{ matrix.asset }}
          path: ${{ runner.temp }}/host-build/assets/*
          if-no-files-found: error
          retention-days: 1

  # Windows is compiled, linted, packaged and test-built on Linux; only the steps
  # that need a real Windows host run on windows-latest (windows-test).
  windows-build:
    needs: changes
    if: needs.changes.outputs.selection != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      HOST_PRODUCTION: ${{ inputs.production }}
      HOST_WINDOWS_TARGET: x86_64-pc-windows-msvc
      CARGO_XWIN_VERSION: 0.23.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set isolated build directories
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/host-cargo" >> "$GITHUB_ENV"
          echo "HOST_BUILD_DIR=$RUNNER_TEMP/host-build" >> "$GITHUB_ENV"
          echo "HOST_WINDOWS_TESTS=$RUNNER_TEMP/host-windows-tests" >> "$GITHUB_ENV"
      # NSIS, the LLVM linker and resource compiler stand in for the MSVC toolchain.
      - name: Install Windows cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld llvm clang zip
      # The Windows SDK and CRT download is large and Microsoft-hosted, so it is cached
      # by cargo-xwin version, also for production builds (it is not a built artefact).
      - name: Cache the Windows SDK download
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sdk-${{ env.CARGO_XWIN_VERSION }}
      # Skipped for production builds: release artefacts never reuse cached binaries.
      - name: Cache Cargo registry, tools and build output
        if: inputs.production != true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/host
          key: x86_64-pc-windows-msvc-xwin
      - name: Install locked dependencies and cross toolchain
        run: |
          bun install --frozen-lockfile
          bun install --cwd apps/host --frozen-lockfile
          cd apps/host
          rustup show
          rustup target add "$HOST_WINDOWS_TARGET"
          cargo install tauri-cli --version 2.12.3 --locked
          cargo install cargo-xwin --version "$CARGO_XWIN_VERSION" --locked
      # generate_context! needs the built frontend before any cargo step.
      - name: Frontend build
        working-directory: apps/host
        run: bun run build
      - name: Windows lint
        working-directory: apps/host
        run: cargo xwin clippy --locked --workspace --all-targets --target "$HOST_WINDOWS_TARGET" -- -D warnings
      # The executables run in windows-test; their JSON build messages locate them.
      - name: Build Windows test executables
        working-directory: apps/host
        run: |
          cargo xwin test --no-run --locked --workspace --target "$HOST_WINDOWS_TARGET" \
            --message-format=json-render-diagnostics |
            bun run ../../scripts/host/windows-tests.ts --collect "$HOST_WINDOWS_TESTS" .
      - uses: actions/upload-artifact@v4
        with:
          name: host-windows-tests
          path: ${{ runner.temp }}/host-windows-tests
          if-no-files-found: error
          retention-days: 1
      - name: Package the Windows app
        run: |
          args=(--windows)
          if [ "$HOST_PRODUCTION" = true ]; then args+=(--production); fi
          bun run scripts/host/build-release.ts "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: host-unsigned-windows-x64
          path: ${{ runner.temp }}/host-build/assets/*
          if-no-files-found: error
          retention-days: 1

  windows-test:
    needs: [changes, windows-build]
    if: needs.changes.outputs.selection != 'skip'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HOST_PRODUCTION: ${{ inputs.production }}
    steps:
      # LF checkout: the packaged trust key was built on Linux and is compared byte for byte.
      - run: git config --global core.autocrlf false
      # The sources supply each test's working directory and the smoke scripts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: host-windows-tests
          path: ${{ runner.temp }}/host-windows-tests
      - uses: actions/download-artifact@v4
        with:
          name: host-unsigned-windows-x64
          path: ${{ runner.temp }}/host-windows-assets
      - name: Run the Windows test executables
        run: bun run scripts/host/windows-tests.ts --run "$RUNNER_TEMP/host-windows-tests" apps/host
      - name: Smoke the Windows package
        run: |
          args=(--smoke "--target=windows-x64"
                "--asset=$RUNNER_TEMP/host-windows-assets/ais-host-windows-x64.zip"
                "--destination=$RUNNER_TEMP/clean launch é")
          if [ "$HOST_PRODUCTION" = true ]; then args+=(--production); fi
          bun run scripts/host/release-assets.ts "${args[@]}"

  gate:
    if: ${{ always() }}
    needs: [changes, checks, native, windows-build, windows-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTION: ${{ needs.changes.outputs.selection }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          WINDOWS_BUILD_RESULT: ${{ needs.windows-build.result }}
          WINDOWS_TEST_RESULT: ${{ needs.windows-test.result }}
        run: bun run scripts/host/check-workflows.ts --gate
