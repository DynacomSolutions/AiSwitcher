name: Live image

on:
  workflow_call:
    inputs:
      release:
        description: Build and boot-check the production release image
        required: false
        type: boolean
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Decides whether the image build is needed. Fails open: any doubt builds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      affected: ${{ steps.filter.outputs.affected }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Select by the dependency graph
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          result=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
            && changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA") \
            && bun install --frozen-lockfile \
            && bun run build \
            && picked=$(printf '%s\n' "$changed" | bun image/build/affected.ts dist/ais.meta.json) \
            && [ "$picked" = false ]; then
            result=false
          fi
          echo "affected=$result" >> "$GITHUB_OUTPUT"

  # GitHub-hosted runner only: this repository is public, never self-hosted.
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.affected != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ inputs.release && fromJSON('["test","production"]') || fromJSON('["test"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      # Assembly and boot-test tools; the unit tests exercise them for real.
      - name: Install image tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso jq expect tcl gdisk dosfstools mtools e2fsprogs exfatprogs \
            syslinux syslinux-common grub-common grub-efi-amd64-bin \
            python3 qemu-system-x86 ovmf nodejs

      - name: Test the image scripts
        run: |
          set -euo pipefail
          bun test test/image
          git ls-files image | while read -r f; do
            if [ -f "$f" ] && [ ! -L "$f" ] && head -n 1 "$f" | grep -Eq '^#!.*(bash|/sh)'; then echo "$f"; fi
          done | xargs shellcheck -x -P SCRIPTDIR image/archiso/airootfs/etc/profile.d/ais-live-boot.sh image/archiso/airootfs/etc/profile.d/ais-guard.sh

      # Measured: the standard runner has far more than the build needs, so
      # no preinstalled toolchains are removed. Kept as a record per run.
      - name: Record free disk
        run: |
          set -euo pipefail
          df -h /

      - name: Start disk sampler
        run: |
          set -euo pipefail
          image/build/sample-df.sh --once "$RUNNER_TEMP/df-samples.txt"
          nohup image/build/sample-df.sh "$RUNNER_TEMP/df-samples.txt" 5 >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/sampler.pid"

      # Same-commit ais tools and the pinned herdr go into the image.
      - name: Stage the runtime (ais tools, herdr)
        run: |
          set -euo pipefail
          bun run build
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp -r dist "$stage/dist"
          # shellcheck source=image/pins.env
          . image/pins.env
          curl --fail --silent --show-error --location "$HERDR_URL" --output "$stage/herdr"
          echo "$HERDR_SHA256  $stage/herdr" | sha256sum --check
          echo "AIS_STAGE_DIR=$stage" >> "$GITHUB_ENV"

      # CI images are test images: they carry the extra packages in
      # image/test/packages.test that the scenarios need.
      - name: Build the ISO (bootstrap, archiso, mkarchiso)
        run: |
          set -euo pipefail
          start=$(date +%s)
          sudo env AIS_STAGE_DIR="$AIS_STAGE_DIR" AIS_IMAGE_TEST_PACKAGES=${{ matrix.flavour == 'test' && '1' || '0' }} \
            image/build/build.sh >"$RUNNER_TEMP/build.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -n 30 "$RUNNER_TEMP/build.log"
          echo "build_seconds=$(( $(date +%s) - start ))" | tee "$RUNNER_TEMP/build-time.txt"

      - name: Assemble the raw disk image
        run: |
          set -euo pipefail
          sudo chown -R "$USER" out
          image_name='ais-live.img'
          if [[ '${{ matrix.flavour }}' == production ]]; then image_name='ais-live-production.img'; fi
          AIS_GRUB_MODULE_DIR=out/grub-x86_64-efi image/build/assemble.sh out/archiso.iso "out/$image_name"
          ls -l "out/$image_name"

      - name: Stop disk sampler
        if: always()
        run: |
          set -euo pipefail
          pid=$(cat "$RUNNER_TEMP/sampler.pid")
          # A dead sampler would leave gaps in the peak figure.
          kill -0 "$pid" || { echo "disk sampler died"; exit 1; }
          kill "$pid"
          image/build/sample-df.sh --once "$RUNNER_TEMP/df-samples.txt"

      - name: Assert peak disk under 80% of free
        run: |
          set -euo pipefail
          image/build/assert-disk.sh "$RUNNER_TEMP/df-samples.txt"

      - name: Assert BIOS and EFI El Torito records
        run: |
          set -euo pipefail
          xorriso -indev out/archiso.iso -report_el_torito as_mkisofs > "$RUNNER_TEMP/eltorito.txt"
          cat "$RUNNER_TEMP/eltorito.txt"
          image/build/assert-eltorito.sh "$RUNNER_TEMP/eltorito.txt"

      - name: Record measurements
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Live image build measurements"
            cat "$RUNNER_TEMP/build-time.txt" || true
            grep -E '^BUILD-(STAGE|DF):' "$RUNNER_TEMP/build.log" || true
            ls -l out || true
            echo "first and last disk samples (epoch used_kib avail_kib):"
            head -n 1 "$RUNNER_TEMP/df-samples.txt" || true
            tail -n 1 "$RUNNER_TEMP/df-samples.txt" || true
            awk 'NF==3 && $2>m {m=$2} END {print "max used_kib=" m}' "$RUNNER_TEMP/df-samples.txt" || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The image stays on this runner's disk: boot tests and scenarios run
      # here, so no multi-gigabyte disk image goes through Actions storage.
      # The hosted runner exposes /dev/kvm but not to the runner user.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # The ISO is not needed after the El Torito check; free its space.
      - name: Drop the ISO
        run: |
          set -euo pipefail
          rm -f out/archiso.iso

      # Boots the raw image under QEMU with SeaBIOS (bios) and OVMF (uefi).
      - name: Boot (bios and uefi)
        run: |
          set -euo pipefail
          image_name='ais-live.img'
          if [[ '${{ matrix.flavour }}' == production ]]; then image_name='ais-live-production.img'; fi
          for firmware in bios uefi; do
            echo "::group::Boot ($firmware)"
            image/test/run-qemu.sh "out/$image_name" "$firmware"
            find out -name live.img -delete
            echo "::endgroup::"
          done

      # Negative scenario: a reboot after the poweroff acknowledgement must
      # fail the harness.
      - name: Reboot after acknowledgement is rejected
        run: |
          set -euo pipefail
          image_name='ais-live.img'
          if [[ '${{ matrix.flavour }}' == production ]]; then image_name='ais-live-production.img'; fi
          bash image/test/reboot-after-ack.sh "out/$image_name"
          find out -name live.img -delete

      # Task 4 boot flow and user split, Task 5 disk guard, Task 6 exchange.
      # Every scenario runs; any failure fails the step after the last one.
      - name: Scenarios
        if: matrix.flavour == 'test'
        run: |
          set -euo pipefail
          scenarios=(
            "boot-flow online-first bios"
            "boot-flow online-first uefi"
            "boot-flow online-second bios"
            "boot-flow online-retry bios"
            "boot-flow offline-model-yes bios"
            "boot-flow offline-model-no bios"
            "boot-flow offline-model-timeout bios"
            "boot-flow offline-no-model bios"
            "guard probe bios"
            "guard probe uefi"
            "exchange basic bios"
            "exchange basic uefi"
            "exchange auth bios"
          )
          failed=()
          for entry in "${scenarios[@]}"; do
            read -r scenario arg firmware <<<"$entry"
            echo "::group::Scenario $scenario $arg ($firmware)"
            if ! image/test/run-scenario.sh out/ais-live.img "$firmware" "$scenario" "$arg"; then
              failed+=("$entry")
            fi
            find out -name live.img -delete
            find out -name media.img -delete
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'FAILED scenario: %s\n' "${failed[@]}"
            exit 1
          fi

      # Small logs only; the image itself never leaves the runner.
      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.flavour }}
          path: |
            out/qemu-*/serial.log
            out/qemu-*/qmp.log
            out/qemu-*/qmp-shutdown.json
            out/scenario-*/qemu-*/serial.log
            out/scenario-*/qemu-*/qmp.log
            out/scenario-*/http.log
            out/build-info.json
          retention-days: 3
          if-no-files-found: warn

      # Tag releases only: the signed release job is a separate, write-scoped
      # job and needs the production image. One short-lived artifact, on tags only.
      - name: Hand the production image to the release job
        if: inputs.release && matrix.flavour == 'production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ais-live-release-image
          path: out/ais-live-production.img
          retention-days: 1
          compression-level: 6

  # Always reports, so a required check never hangs on skipped jobs.
  gate:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          [ "$CHANGES" = "success" ] || exit 1
          case "$BUILD" in success|skipped) ;; *) exit 1 ;; esac
