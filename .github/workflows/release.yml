name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
      draft:
        description: "Create as draft"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ais-public-runners
    strategy:
      matrix:
        target:
          - { bun: bun-darwin-arm64, name: darwin-arm64 }
          - { bun: bun-darwin-x64, name: darwin-x64 }
          - { bun: bun-linux-arm64, name: linux-arm64 }
          - { bun: bun-linux-x64, name: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build binaries for ${{ matrix.target.name }}
        # Asset names must match what src/installer.ts requests at
        # `<tool>-<platform>` — it downloads these directly from the release
        # over HTTPS, no `gh` CLI or auth involved. `open` shadows macOS's
        # /usr/bin/open (no equivalent bare `open` command on Linux to fall
        # back to for passthrough), so it's only built for darwin targets —
        # see scripts/build.ts's matching platform gate. `ais` (the
        # management CLI), `grok` (a thin passthrough wrapper, same as
        # claude/codex — whether the real grok CLI itself ships for a given
        # platform is a runtime concern for resolve-binary.ts, not a build
        # concern here), and `zai`/`ali` (same story: both proxy the real
        # `crush` binary, not a platform-gated concept of their own) are not
        # platform-gated.
        run: |
          bun build --compile --target=${{ matrix.target.bun }} src/claude.ts --outfile claude-${{ matrix.target.name }}
          bun build --compile --target=${{ matrix.target.bun }} src/codex.ts --outfile codex-${{ matrix.target.name }}
          bun build --compile --target=${{ matrix.target.bun }} src/grok.ts --outfile grok-${{ matrix.target.name }}
          bun build --compile --target=${{ matrix.target.bun }} src/kimi.ts --outfile kimi-${{ matrix.target.name }}
          bun build --compile --target=${{ matrix.target.bun }} src/zai.ts --outfile zai-${{ matrix.target.name }}
          bun build --compile --target=${{ matrix.target.bun }} src/ali.ts --outfile ali-${{ matrix.target.name }}
          bun build --compile --target=${{ matrix.target.bun }} src/pi.ts --outfile pi-${{ matrix.target.name }}
          bun build --compile --target=${{ matrix.target.bun }} src/opencode.ts --outfile opencode-${{ matrix.target.name }}
          bun build --compile --target=${{ matrix.target.bun }} src/installer.ts --outfile install-${{ matrix.target.name }}
          bun build --compile --target=${{ matrix.target.bun }} src/ais.ts --outfile ais-${{ matrix.target.name }}
          chmod +x claude-${{ matrix.target.name }} codex-${{ matrix.target.name }} grok-${{ matrix.target.name }} kimi-${{ matrix.target.name }} zai-${{ matrix.target.name }} ali-${{ matrix.target.name }} pi-${{ matrix.target.name }} opencode-${{ matrix.target.name }} install-${{ matrix.target.name }} ais-${{ matrix.target.name }}
          case "${{ matrix.target.name }}" in
            darwin-*)
              bun build --compile --target=${{ matrix.target.bun }} src/open.ts --outfile open-${{ matrix.target.name }}
              chmod +x open-${{ matrix.target.name }}
              ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-profile-switcher-${{ matrix.target.name }}
          path: |
            claude-${{ matrix.target.name }}
            codex-${{ matrix.target.name }}
            grok-${{ matrix.target.name }}
            kimi-${{ matrix.target.name }}
            zai-${{ matrix.target.name }}
            ali-${{ matrix.target.name }}
            pi-${{ matrix.target.name }}
            opencode-${{ matrix.target.name }}
            open-${{ matrix.target.name }}
            install-${{ matrix.target.name }}
            ais-${{ matrix.target.name }}

  build-tui:
    # aistui (apps/tui) is a Rust crate, so it cannot ride the bun build
    # matrix above. Same four release platforms, same <tool>-<platform>
    # asset convention the installer downloads by (`aistui-darwin-arm64`,
    # ...), uploaded as separate artifacts so the release job's
    # artifacts/*/* glob picks them up unchanged. Toolchains per leg:
    # darwin targets build natively on the org's apple-builder macOS
    # runners (Apple's toolchain links both the arm64 and x86_64 slices);
    # linux-x64 builds natively on ubuntu; linux-arm64 needs a cross link
    # toolchain, and `cross` (pinned Docker toolchain) is the least fragile
    # CI path for aarch64-unknown-linux-gnu. If a leg ever proves
    # unreliable, drop it from the matrix and say so here rather than
    # failing the whole release.
    runs-on: ${{ matrix.target.runner }}
    strategy:
      matrix:
        target:
          - { name: darwin-arm64, triple: aarch64-apple-darwin, runner: apple-builder, builder: cargo }
          - { name: darwin-x64, triple: x86_64-apple-darwin, runner: apple-builder, builder: cargo }
          - { name: linux-x64, triple: x86_64-unknown-linux-gnu, runner: ubuntu-latest, builder: cargo }
          - { name: linux-arm64, triple: aarch64-unknown-linux-gnu, runner: ubuntu-latest, builder: cross }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Install cross (aarch64 cross-link toolchain)
        if: matrix.target.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build aistui for ${{ matrix.target.name }}
        working-directory: apps/tui
        run: |
          ${{ matrix.target.builder }} build --release --locked --target ${{ matrix.target.triple }}
          # upload-artifact cannot rename, and the release job uploads each
          # file under its own basename, so the asset itself must carry the
          # full aistui-<platform> name.
          cp target/${{ matrix.target.triple }}/release/aistui ../../aistui-${{ matrix.target.name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistui-${{ matrix.target.name }}
          path: aistui-${{ matrix.target.name }}

  release:
    needs: [build, build-tui]
    runs-on: ais-public-runners
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs/promises");
            const path = require("node:path");
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              draft: process.env.RELEASE_DRAFT === "true",
              prerelease: process.env.RELEASE_PRERELEASE === "true",
              generate_release_notes: true,
            });
            const globber = await glob.create("artifacts/*/*");
            for await (const file of globber.globGenerator()) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: path.basename(file),
                data: await fs.readFile(file),
              });
            }
