<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIS Browser</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand"><img class="mark" src="icons/icon-48.png" alt="" aria-hidden="true"><span class="name">AIS Browser</span></div>
    <span id="chip" class="chip" role="status"></span>
  </header>
  <div id="requests" class="requests" aria-live="polite" hidden></div>
  <div class="tabs" role="tablist" aria-label="Panel">
    <button type="button" role="tab" id="tab-chat" aria-selected="false" aria-controls="chat" tabindex="-1">Chat</button>
    <button type="button" role="tab" id="tab-status" aria-selected="false" aria-controls="status" tabindex="-1">Status</button>
  </div>
  <section id="chat" class="panel" role="tabpanel" aria-labelledby="tab-chat" hidden></section>
  <p id="panel-loading" class="hint loading">Loading</p>
  <main id="status" class="panel" role="tabpanel" aria-labelledby="tab-status" aria-live="polite" hidden></main>
  <footer id="ver" class="ver"></footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
