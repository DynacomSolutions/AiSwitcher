[workspace]
resolver = "2"
members = ["crates/core", "crates/helper", "src-tauri"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-build = { version = "=2.6.3" }

# Debug-built SHA-256 over multi-GiB sparse images made the file-test suite
# take ~30 minutes; optimise only the hashing dependency.
[profile.dev.package.sha2]
opt-level = 3
