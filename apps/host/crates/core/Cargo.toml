[package]
name = "ais-host-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
getrandom = "=0.3.4"
minisign-verify = "=0.3.0"
zstd = "=0.14.3"
minisign = { version = "=0.10.0", optional = true }
age = "=0.11.5"
chrono = "=0.4.45"
fs2 = "=0.4.3"
libc = "=0.2.191"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
zeroize = "=1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "=4.1.0", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.6.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[features]
file-test = ["dep:minisign"]

[[bin]]
name = "host-file-check"
path = "src/bin/host-file-check.rs"
required-features = ["file-test"]

[dev-dependencies]
minisign = "=0.10.0"


[[bin]]
name = "ais-host-bundle-bridge"
path = "src/bin/ais-host-bundle-bridge.rs"
required-features = ["file-test"]
