# mkarchiso runs every hook in /etc/pacman.d/hooks while building the image,
# before bash exists in the new root, so the hooks are linked in at boot.
L /etc/pacman.d/hooks/ais-live-pkglist.hook - - - - /usr/local/share/ais-live/pacman-hooks/ais-live-pkglist.hook
L /etc/pacman.d/hooks/ais-live-snapshot.hook - - - - /usr/local/share/ais-live/pacman-hooks/ais-live-snapshot.hook
