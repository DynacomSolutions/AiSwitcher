# Embedded in the removable-media EFI loader. The menu stays on the FAT ESP
# so the boot harness can modify a disposable copy without rebuilding GRUB.
# cmdpath names the ESP this removable-media loader actually came from.
if regexp --set=1:ais_boot_device '^\(([^)]*)\)' "$cmdpath"; then
    set root=$ais_boot_device
else
    echo 'Cannot identify the firmware boot partition.'
    halt
fi
if probe --set=ais_boot_partuuid --part-uuid ($root); then
    export ais_boot_partuuid
else
    echo 'Cannot read the firmware boot PARTUUID.'
    halt
fi
set prefix=($root)/boot/grub
configfile $prefix/grub.cfg
