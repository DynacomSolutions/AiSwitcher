insmod part_gpt
insmod fat
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
set default=latest
set timeout=3

menuentry 'Start with latest state' --id latest {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisodevice=/dev/disk/by-label/AISBASE systemd.firstboot=off ais.mode=latest
    initrd /arch/boot/x86_64/initramfs-linux.img
}
menuentry 'Choose a snapshot after unlock' --id pick {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisodevice=/dev/disk/by-label/AISBASE systemd.firstboot=off ais.mode=pick
    initrd /arch/boot/x86_64/initramfs-linux.img
}
menuentry 'Start with the clean base' --id clean {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisodevice=/dev/disk/by-label/AISBASE systemd.firstboot=off ais.mode=clean
    initrd /arch/boot/x86_64/initramfs-linux.img
}
