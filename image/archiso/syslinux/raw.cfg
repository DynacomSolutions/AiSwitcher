SERIAL 0 115200
UI menu.c32
MENU TITLE ais live
DEFAULT latest
TIMEOUT 30

LABEL latest
MENU LABEL Start with latest state
LINUX /arch/boot/x86_64/vmlinuz-linux
INITRD /arch/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=arch archisodevice=/dev/disk/by-partuuid/HOST_APP_REQUIRED systemd.firstboot=off copytoram=n ais.base=HOST_APP_REQUIRED ais.exchange=HOST_APP_REQUIRED ais.drive=HOST_APP_REQUIRED ais.mode=latest

LABEL pick
MENU LABEL Choose a snapshot after unlock
LINUX /arch/boot/x86_64/vmlinuz-linux
INITRD /arch/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=arch archisodevice=/dev/disk/by-partuuid/HOST_APP_REQUIRED systemd.firstboot=off copytoram=n ais.base=HOST_APP_REQUIRED ais.exchange=HOST_APP_REQUIRED ais.drive=HOST_APP_REQUIRED ais.mode=pick

LABEL clean
MENU LABEL Start with the clean base
LINUX /arch/boot/x86_64/vmlinuz-linux
INITRD /arch/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=arch archisodevice=/dev/disk/by-partuuid/HOST_APP_REQUIRED systemd.firstboot=off copytoram=n ais.base=HOST_APP_REQUIRED ais.exchange=HOST_APP_REQUIRED ais.drive=HOST_APP_REQUIRED ais.mode=clean
