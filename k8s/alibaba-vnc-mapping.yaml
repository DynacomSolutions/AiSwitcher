# App-owned public alias for the interactive Alibaba auth browser (sub-service
# `alibaba` of the `ais` project). Serves the chrome-auth-personal noVNC UI
# (port 7900) at ${AIS_ALIBABA_PUBLIC_HOSTNAME} — passwordless by design, so
# this hostname should only ever be reachable over a private network (VPN,
# mesh network, or similar), never exposed publicly without additional auth.
# timeout 0 keeps long VNC sessions from being culled mid-use; Emissary 3.x
# proxies the noVNC WebSocket on /websockify without extra config.
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: ais-alibaba-public
  namespace: ${AIS_NAMESPACE}
spec:
  hostname: ${AIS_ALIBABA_PUBLIC_HOSTNAME}
  prefix: /
  service: chrome-auth-personal.chrome-mcp:7900
  allow_upgrade:
  - websocket
  timeout_ms: 0
