apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PROJECT}
  namespace: ${AIS_NAMESPACE}
  labels:
    app: ${PROJECT}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${PROJECT}
  template:
    metadata:
      labels:
        app: ${PROJECT}
    spec:
      # The console scans /proc to list live agent processes; without the
      # host PID namespace it only ever sees itself ("no agent processes").
      # Read visibility is the point; runAsUser 1000 still cannot touch
      # processes owned by other users.
      hostPID: true
      # The console reads (and edits) the same single-user AIS state the host
      # daemon would: identity registries, session transcripts, usage data.
      # Everything is uid 1000 on the host, so no fsGroup juggling needed.
      #
      # The hostPath data below only exists on one host, so this MUST be
      # pinned to that node (see docs/DEPLOY.md for the pattern). Leave
      # AIS_NODE_HOSTNAME empty in a cluster where every node can see the
      # same data, and drop this nodeSelector block entirely.
      nodeSelector:
        kubernetes.io/hostname: ${AIS_NODE_HOSTNAME}
      containers:
        - name: app
          image: ${AIS_IMAGE_REGISTRY}/${PROJECT}:${TAG}
          imagePullPolicy: Always
          env:
            - name: AIS_WEB_ALLOWED_HOSTS
              # Comma-separated vhostnames the guard trusts like loopback
              # peers, e.g. a rewritten internal hostname plus the raw
              # public hostname if ingress routes can skip the rewrite.
              value: ${AIS_WEB_ALLOWED_HOSTS}
            - name: AIS_AUTH_REFRESH_INTERVAL_MS
              value: "600000"
            - name: AIS_K8S_API_SERVER
              value: https://kubernetes.default.svc
            - name: AIS_WEB_STATE_DIR
              # Pod-local console lifecycle state (server.json,
              # auth-refresh-state.json, file-edit backups). The pod sees the
              # host's AIS home via the hostPath mounts AND shares its PID
              # namespace (hostPID), so a shared state file would let each
              # side's lifecycle churn kill the other's daemon (a host
              # `ais web stop` could SIGTERM the pod's daemon and the two
              # would clobber each other's port/token). Relocating the state
              # dir plus src/cli/web.ts's /proc cmdline kill-guard make
              # `ais web stop` on either side refuse to touch the other.
              value: /web/state
          ports:
            - containerPort: ${PORT}
          readinessProbe:
            httpGet:
              path: /api/health
              port: ${PORT}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: ${PORT}
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: ais-home
              mountPath: ${AIS_CONTAINER_HOME}/.ais
            - name: claude-home
              mountPath: ${AIS_CONTAINER_HOME}/.claude
            - name: codex-home
              mountPath: ${AIS_CONTAINER_HOME}/.codex
            - name: grok-home
              mountPath: ${AIS_CONTAINER_HOME}/.grok
            - name: kimi-home
              mountPath: ${AIS_CONTAINER_HOME}/.kimi-code
            - name: zai-home
              mountPath: ${AIS_CONTAINER_HOME}/.zai
            - name: ali-home
              mountPath: ${AIS_CONTAINER_HOME}/.ali
            - name: pi-home
              mountPath: ${AIS_CONTAINER_HOME}/.pi
            - name: opencode-home
              mountPath: ${AIS_CONTAINER_HOME}/.opencode
            - name: kube-config
              mountPath: ${AIS_CONTAINER_HOME}/.kube
              readOnly: true
            # ~/.kube/config is commonly a symlink to a real kubeconfig
            # file; mounting that target at the same path is what makes
            # the symlink resolve inside the container.
            - name: k3s-kubeconfig
              mountPath: /etc/rancher/k3s
              readOnly: true
            # Persist Bun's package cache across pod restarts: a cache miss
            # on every cold container start slows down anything that shells
            # out via bunx.
            - name: bun-cache
              mountPath: ${AIS_CONTAINER_HOME}/.bun
            # Writable pod-local home for AIS_WEB_STATE_DIR. emptyDir on
            # purpose (NOT a hostPath): the whole point is that this state is
            # NOT the host's. It is rebuilt on every daemon start and dies
            # with the pod, which only costs ephemeral pre-edit file backups
            # and refresh-failure counters.
            - name: web-state
              mountPath: /web/state
      volumes:
        - name: ais-home
          hostPath:
            path: ${AIS_HOST_HOME}/.ais
            type: Directory
        - name: claude-home
          hostPath:
            path: ${AIS_HOST_HOME}/.claude
            type: Directory
        - name: codex-home
          hostPath:
            path: ${AIS_HOST_HOME}/.codex
            type: Directory
        - name: grok-home
          hostPath:
            path: ${AIS_HOST_HOME}/.grok
            type: Directory
        - name: kimi-home
          hostPath:
            path: ${AIS_HOST_HOME}/.kimi-code
            type: Directory
        - name: zai-home
          hostPath:
            path: ${AIS_HOST_HOME}/.zai
            type: Directory
        - name: ali-home
          hostPath:
            path: ${AIS_HOST_HOME}/.ali
            type: Directory
        - name: pi-home
          hostPath:
            path: ${AIS_HOST_HOME}/.pi
            type: Directory
        - name: opencode-home
          hostPath:
            path: ${AIS_HOST_HOME}/.opencode
            type: Directory
        - name: kube-config
          hostPath:
            path: ${AIS_HOST_KUBE_DIR}
            type: Directory
        - name: k3s-kubeconfig
          hostPath:
            path: /etc/rancher/k3s
            type: Directory
        - name: bun-cache
          hostPath:
            path: ${AIS_HOST_HOME}/.bun
            type: Directory
        - name: web-state
          emptyDir: {}
