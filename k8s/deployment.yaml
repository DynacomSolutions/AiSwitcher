apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PROJECT}
  namespace: dev
  labels:
    app: ${PROJECT}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${PROJECT}
  template:
    metadata:
      labels:
        app: ${PROJECT}
    spec:
      # The console scans /proc to list live agent processes; without the
      # host PID namespace it only ever sees itself ("no agent processes").
      # Read visibility is the point; runAsUser 1000 still cannot touch
      # processes owned by other users.
      hostPID: true
      # The console reads (and edits) the same single-user AIS state the host
      # daemon would: identity registries, session transcripts, usage data.
      # Everything is uid 1000 on the host, so no fsGroup juggling needed.
      #
      # The hostPath data lives on this workstation only, so pin the pod to
      # the control-plane node (same pattern mc3-media and the artifacts
      # pod use); eu3/eu4/hq1 have no /home/thomas.
      nodeSelector:
        kubernetes.io/hostname: archlinux
      containers:
        - name: app
          image: localhost:5000/${PROJECT}:${TAG}
          imagePullPolicy: Always
          env:
            - name: AIS_WEB_ALLOWED_HOSTS
              # Both the rewritten (host_rewrite: ais.localhost) and the raw
              # public hostname: when ingress routes skip the rewrite the
              # app still sees a trusted vhost instead of a 403.
              value: ${PROJECT}.localhost,${PROJECT}.dynacom.dev
            - name: AIS_AUTH_REFRESH_INTERVAL_MS
              value: "600000"
            - name: AIS_K8S_API_SERVER
              value: https://kubernetes.default.svc
          ports:
            - containerPort: ${PORT}
          readinessProbe:
            httpGet:
              path: /api/health
              port: ${PORT}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: ${PORT}
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: ais-home
              mountPath: /home/thomas/.ais
            - name: claude-home
              mountPath: /home/thomas/.claude
            - name: codex-home
              mountPath: /home/thomas/.codex
            - name: grok-home
              mountPath: /home/thomas/.grok
            - name: kimi-home
              mountPath: /home/thomas/.kimi-code
            - name: zai-home
              mountPath: /home/thomas/.zai
            - name: ali-home
              mountPath: /home/thomas/.ali
            - name: pi-home
              mountPath: /home/thomas/.pi
            - name: opencode-home
              mountPath: /home/thomas/.opencode
            - name: kube-config
              mountPath: /home/thomas/.kube
              readOnly: true
            # ~/.kube/config is a symlink to this host file; mounting the
            # target at the same path is what makes the symlink resolve.
            - name: k3s-kubeconfig
              mountPath: /etc/rancher/k3s
              readOnly: true
      volumes:
        - name: ais-home
          hostPath:
            path: /home/thomas/.ais
            type: Directory
        - name: claude-home
          hostPath:
            path: /home/thomas/.claude
            type: Directory
        - name: codex-home
          hostPath:
            path: /home/thomas/.codex
            type: Directory
        - name: grok-home
          hostPath:
            path: /home/thomas/.grok
            type: Directory
        - name: kimi-home
          hostPath:
            path: /home/thomas/.kimi-code
            type: Directory
        - name: zai-home
          hostPath:
            path: /home/thomas/.zai
            type: Directory
        - name: ali-home
          hostPath:
            path: /home/thomas/.ali
            type: Directory
        - name: pi-home
          hostPath:
            path: /home/thomas/.pi
            type: Directory
        - name: opencode-home
          hostPath:
            path: /home/thomas/.opencode
            type: Directory
        - name: kube-config
          hostPath:
            path: /home/thomas/.kube
            type: Directory
        - name: k3s-kubeconfig
          hostPath:
            path: /etc/rancher/k3s
            type: Directory
